# Execution speed: 0 = half of the speeds set below, 0.5 = the speeds set below, 1 = the fast values listed here.
# Rates scale linearly; durations scale as rates, 1/duration.
speed:
  pipeline_speed: 0.5
  fast:
    planner:
      linear_speed: 0.3
      angular_speed: 0.75
      door_rate_deg: 15.0
      push_door_rate_deg: 10.0
      arm_speed: 0.6
    tracking:
      max_linear: 0.45
      max_angular: 1.2
      joint_velocity_fraction: 0.75
    grasp:
      move_speed: 1.3
      approach_speed: 0.5
      min_move_s: 0.5
      hand_duration_s: 1.0
      max_joint_speed_fraction: 1.0
  durations: [regrasp_time, min_move_s, hand_duration_s]
  # The base tracking law corrects in proportion to the base speed, and the arm must keep the hand on the handle
  # while the base turns: a slower base or arm drifts off while the arm holds the door.
  not_below_today: [linear_speed, angular_speed, max_linear, max_angular, joint_velocity_fraction]

door:
  width: 0.95  # lab door (measured 2026-11-19); the sim doors are 0.90
  thickness: 0.04
  height: 2.00
  wall_thickness: 0.06  # frame/wall standing out of the door face on the push side
  wall_length: 1.00

arm:
  gripper_frame: "hand_{side}_grasping_frame"
  sphere_links: ["arm_{side}_1_link", "arm_{side}_3_link", "arm_{side}_4_link", "arm_{side}_6_link"]
  sphere_radius: 0.07
  sphere_spacing: 0.10
  # The robot's own head and upper torso
  body_spheres:
    - [head_2_link, [0.012, 0.04, 0.06], 0.12]
    - [head_2_link, [0.012, 0.04, -0.06], 0.12]
    - [head_1_link, [0.01, 0.0, 0.09], 0.09]
    - [torso_lift_link, [0.05, 0.0, -0.12], 0.19]
  body_check_from: "arm_{side}_4_link"

collision:
  base_radius: 0.30
  base_center_height: 0.15
  margin: 0.03

tracking:
  frame: map
  rate_hz: 50.0
  slow_cycle_s: 0.04  # a control cycle longer than this is logged with where its time went
  command_lookahead_s: 0.1
  max_command_lead: 0.15
  joint_velocity_fraction: 0.5
  timeout_factor: 5.0
  stall_timeout_s: 3.0
  k_x: 1.0
  k_y: 10.0
  k_theta: 6.0
  k_heading: 1.0
  max_linear: 0.3
  max_angular: 0.8
  arm_gain: 3.0
  damping: 0.05
  nullspace_gain: 0.5
  limit_gain: 1.0
  limit_margin: 0.25
  gripper_error_slow: 0.02
  gripper_error_stop: 0.05
  gripper_error_abort: 0.08
  base_error_slow: 0.05
  base_error_stop: 0.15
  heading_error_slow: 0.09
  heading_error_stop: 0.26  # the plan slows from heading_error_slow
  min_base_rate: 0.3
  catch_up_margin: 0.035
  lost_grasp_deg: 10.0
  lost_grasp_s: 1.0

grasp:
  arms: [right, left]
  pull:
    rpy: [3.14159, 1.5708, 0.0]
    door_offset:
      right: [0.06, 0.01, 0.025]
      left: [-0.02, 0.01, 0.025]
  push:
    rpy: [-1.5708, 0.0, -1.5708]
    door_offset:
      right: [0.05, 0.01, -0.02]  # 5 cm along the lever: the handle is 9 cm from the frame
      left: [0.01, 0.01, 0.013]
    back_door_offset:
      right: [-0.03, 0.01, -0.02]
      left: [0.02, 0.01, -0.02]
  standoff: 0.20
  approach_overdrive: 0.015
  unfold_q: [0.2, -1.0, 1.5, 1.9, -1.6, 0.6, 0.0]
  approach_points: 6
  move_speed: 0.7
  approach_speed: 0.3
  min_move_s: 1.0
  max_joint_speed_fraction: 0.75
  hand_open: [0.0, 0.0, 0.0]
  hand_closed: [6.2, 6.8, 9.2]  # thumb, index, mrl; PAL close_right. The fingers stop on the lever.
  hand_duration_s: 2.0
  max_sweep_deg: 45.0
  pull_limit_deg: 45.0
  release_drop: 0.08
  retrace_tolerance: 0.1
  contact_tolerance: 0.2
  home_tolerance: 0.05
  move_margin: 0.015
  grasp_attempts: 2
  skip_unused_first_grasp: true
  max_grasp_error: 0.03
  door_agreement_deg: 6.0
  joint_step: 0.05
  joint_margin: 0.10
  ik_iterations: 300
  random_seeds: 40

planner:
  resolution: 0.05
  drive_ramp_s: 1.0
  push_release_ramp_s: 1.5
  heading_bins: 16
  step_cells: 4
  samples_per_edge: 3
  max_joint_step: 0.2
  arm_speed: 0.3
  angle_step_deg: 5.0
  passable_margin_deg: 2.0
  max_door_steps: 2
  linear_speed: 0.2
  angular_speed: 0.5
  door_rate_deg: 10.0
  push_door_rate_deg: 10.0
  regrasp_time: 15.0
  max_expansions: 4000
  stall_expansions: 600
  ik_iterations: 60
  joint_margin: 0.20
  push_joint_margin: 0.25
  push_wrist_margin: 0.35
  workers: 8

goal:
  preferred_angle_deg: 90.0
  pass_width: 0.60
  handle_depth: 0.07
  reach_min: 0.35
  reach_max: 0.95
  max_bearing_deg: 100.0
  cell_size: 0.05
  heading_bins: 16
  extension_expansions: 300
  regrasp_searches: 4
  spot_regrasps_first: true
  recoveries: 2
  approach_plans: 2  # plan_approach: spots with a whole opening planned from them (one plan each), best first
  regrasps_without_progress: 2
  min_progress_deg: 1.0
  replan_base_error: 0.05
  replan_heading_error_deg: 8.0

scan:
  max_age_s: 0.5
  inlier_distance: 0.03
  min_inliers: 10
  angle_step_deg: 1.0
  max_angle_deg: 120.0
  hinge_clearance: 0.15
  max_rays_through: 3
  fit_error_deg: 3.0

# Door leaf hidden from the SLAM scans
leaf_mask:
  enabled: true
  window_deg: 15.0  # the fit looks this far around the tracked angle and a running segment's planned one
  margin: 0.15
  angle_margin_deg: 10.0  # the laser fit of a pulled leaf the robot stands next to can be this far off
  hint_max_age_s: 0.5

force:
  topic: "/wrist_{side}_ft/corrected"
  wait_timeout_s: 5.0
  zero_s: 0.3
  filter_s: 0.04
  contact_force: 6.0
  contact_samples: 3
  lost_force: 2.0
  lost_s: 0.3
  lost_by_force: []
  deadband: 3.0
  compliance: 0.002
  max_offset: 0.04
  offset_leak_s: 5.0
  vertical_compliance: [push] # The vertical compliance is only used when pushing the door.
  # Push grasps: the hand gives back along the door's motion (never ahead) up to max_tangential_offset
  tangential_compliance: [push]
  max_tangential_offset: 0.02
  # Push grasps
  push_force_actions: [push]
  push_force_slow: 25.0
  push_force_stop: 50.0
  breakaway_hold_s: 0.5

# Stop when the SLAM loses track
localization:
  topic: "/odom_icp"  # "" switches the stop off
  lost_covariance: 1000.0
  max_lost_s: 0.5 
  max_silence_s: 1.0

# Driving through after the opening: the first of these distances (m) past the doorway the robot can reach.
pass:
  distances: [1.0, 0.75, 0.5]
  # Lattice step (cells) of the pass plan
  step_cells: 2

# Read afresh for every plan; it must be in the frame of the door poses.
costmap:
  topic: "/tiago_move_base/move_base/global_costmap/costmap"
  timeout_s: 2.0
  occupied_threshold: 100

