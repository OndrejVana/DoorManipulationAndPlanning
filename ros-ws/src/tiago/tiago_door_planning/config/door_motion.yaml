door:
  width: 0.90
  thickness: 0.04
  height: 2.00
  wall_thickness: 0.15
  wall_length: 1.00

arm:
  gripper_frame: "hand_{side}_grasping_frame"
  sphere_links: ["arm_{side}_1_link", "arm_{side}_3_link", "arm_{side}_4_link", "arm_{side}_6_link"]
  sphere_radius: 0.07
  sphere_spacing: 0.10

collision:
  base_radius: 0.30
  base_center_height: 0.15
  margin: 0.05

frames:
  odom: odom
  base: base_footprint

tracking:
  rate_hz: 50.0
  command_lookahead_s: 0.1
  joint_velocity_fraction: 0.5
  timeout_factor: 3.0
  k_x: 1.0
  k_y: 4.0
  k_theta: 2.0
  max_linear: 0.2
  max_angular: 0.5
  arm_gain: 3.0
  damping: 0.05
  nullspace_gain: 0.5
  limit_gain: 1.0
  limit_margin: 0.25
  gripper_error_slow: 0.01
  gripper_error_stop: 0.03
  gripper_error_abort: 0.08
  base_error_slow: 0.05
  base_error_stop: 0.15
