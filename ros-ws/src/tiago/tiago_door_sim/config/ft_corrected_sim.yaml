# ft_corrected_sim: Gazebo wrist torque -> corrected wrench (see the node's docstring).
sides: [left, right]
# Grasp point and sensor origin from the arm_*_7_joint origin, in the sensor axes (from the URDF).
lever_arm: [0.02, 0.0, 0.197]
sensor_offset: [0.0, 0.0, 0.0538]
drop_probability: 0.17
# torque_rotation: Gazebo torque (arm_*_7_link axes) into the sensor axes, row-major.
# mass_com [kg m] and bias [Nm]: fitted to the torque over static poses with the hand open.
right:
  torque_rotation: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  mass_com: [-0.0028, -0.0001, 0.1512]
  bias: [0.107, -0.147, 0.024]
left:
  torque_rotation: [-1, 0, 0, 0, 1, 0, 0, 0, -1]
  mass_com: [0.0178, -0.0013, 0.1694]
  bias: [0.133, -0.287, 0.218]
